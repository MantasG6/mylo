openapi: 3.1.0
info:
  title: Mylo API
  description: |-
    Mylo helps you to achieve anything you want by creating a customizable accountability environment to track your goals.

    Github: [https://github.com/MantasG6/mylo](https://github.com/MantasG6/mylo)

  termsOfService: ...
  contact:
    email: mantas.gricius6@gmail.com
  license:
    name: MIT
    url: https://mit-license.org/
  version: v1
externalDocs:
  description: Check out the Github repo!
  url: https://github.com/MantasG6/mylo
servers:
  - url: https://localhost:8080/api/v3
    description: Local server (OAS 3.2)

tags:
  - name: workspace
    description: All the details about the user workspace
  - name: goal
    description: Operations to add and manage User goals
  - name: progress
    description: Operations to track user progress
  - name: pomodoro
    description: Operations to create and configure pomodoro timers
