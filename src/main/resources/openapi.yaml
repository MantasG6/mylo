components:
  schemas:
    Workspace:
      required:
        - id
        - name
        - userId
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [10]
        userId:
          type: string
          examples: [2d942273-04bb-4e8c-b03a-3efb72b84a62]
        name:
          type: string
          examples: [Personal Goals]
        widgets:
          type: array
          items:
            type: integer
            format: int64
            examples: [44, 468]
    Widget:
      required:
        - widgetType
        - position
        - data
        - workspaces
      type: object
      properties:
        widgetType:
          type: string
          enum:
            - Goal
            - Pomodoro
        position:
          type: integer
          format: int64
          examples: [1]
        data:
          type: object
          examples:
            [Goal]
        workspaces:
          type: array
          items:
            type: integer
            format: int64
            examples: [3, 44, 468]
    Goal:
      required:
        - id
        - userId
        - name
        - target
        - tracking
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [10]
        userId:
          type: string
          examples: [2d942273-04bb-4e8c-b03a-3efb72b84a62]
        name:
          type: string
          examples: [programming]
        target:
          type: integer
          format: int64
          examples: [300]
        tracking:
          type: string
          enum:
            - daily
            - weekly
            - monthly
    Progress:
      required:
        - id
        - goalId
        - userId
        - name
        - target
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [10]
        goalId:
          type: integer
          format: int64
          examples: [44]
        userId:
          type: string
          examples: [2d942273-04bb-4e8c-b03a-3efb72b84a62]
        name:
          type: string
          examples: [programming]
        target:
          type: integer
          format: int64
          examples: [300]
    Pomodoro:
      required:
        - id
        - goalId
        - userId
        - shortBreak
        - longBreak
        - longBreakFrequency
        - work
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [10]
        goalId:
          type: integer
          format: int64
          examples: [4]
        userId:
          type: string
          examples: [2d942273-04bb-4e8c-b03a-3efb72b84a62]
        shortBreak:
          type: integer
          format: int64
          examples: [5]
        longBreak:
          type: integer
          format: int64
          examples: [15]
        longBreakFrequency:
          type: integer
          format: int64
          examples: [4]
        work:
          type: integer
          format: int64
          examples: [25]
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
  requestBodies:
    Goal:
      description: Goal object that needs to be added to the workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Goal'
        application/xml:
          schema:
            $ref: '#/components/schemas/Goal'
  securitySchemes:
    mylo_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://mylo.swagger.io/oauth/authorize
          scopes:
            "write:workspaces": modify workspaces
            "read:workspaces": read workspaces
            "write:goals": modify goals in your account
            "read:goals": read your goals
            "write:progress": modify your progress
            "read:progress": read your progress
            "write:pomodoro": modify pomodoro timers
            "read:pomodoro": read pomodoro timers
    api_key:
      type: apiKey
      name: api_key
      in: header
